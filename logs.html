<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

</head>
<body data-page="logs">
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
  <svg class="brand-mark" viewBox="0 0 30 30" fill="none">
    <rect x="0" y="0" width="13" height="13" rx="2" fill="#2FE0C0"/>
    <rect x="3" y="3" width="7" height="7" rx="1" fill="#0A1120"/>
    <rect x="17" y="0" width="13" height="13" rx="2" fill="#17233D" stroke="#2FE0C0" stroke-width="1.4"/>
    <rect x="0" y="17" width="13" height="13" rx="2" fill="#17233D" stroke="#2FE0C0" stroke-width="1.4"/>
    <rect x="17" y="17" width="4" height="4" rx="1" fill="#2FE0C0"/>
    <rect x="23" y="17" width="7" height="4" rx="1" fill="#233255"/>
    <rect x="17" y="23" width="7" height="7" rx="1" fill="#233255"/>
    <rect x="26" y="26" width="4" height="4" rx="1" fill="#2FE0C0"/>
  </svg>
  <div>
    <div class="brand-name">PLMunTrack</div>
    <div class="brand-sub">VISITOR &amp; ATTENDANCE</div>
  </div>
</div>
      <nav class="nav">
  <a class="nav-item" href="index.html" data-page="dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12h5v9H3zM10 3h5v18h-5zM17 8h4v13h-4z"/></svg>
    Dashboard
  </a>
  <a class="nav-item" href="visitors.html" data-page="visitors">

  </a>
  <a class="nav-item" href="generator.html" data-page="generator">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14h1v1h-1zM14 20h1v1h-1zM17.5 17.5h3.5v3.5h-3.5z"/></svg>
    QR Generator
  </a>
  <a class="nav-item" href="scanner.html" data-page="scanner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8V5a1 1 0 0 1 1-1h3M20 8V5a1 1 0 0 0-1-1h-3M4 16v3a1 1 0 0 0 1 1h3M20 16v3a1 1 0 0 1-1 1h-3"/><path d="M4 12h16"/></svg>

  <a class="nav-item" href="logs.html" data-page="logs">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 3h11l3 3v15H5z"/><path d="M9 11h6M9 15h6M9 7h3"/></svg>

      <div class="nav-spacer"></div>
<div class="sidebar-foot">
  <div class="sec-badge">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    Encrypted local storage
  </div>
</div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div>
          <h1 id="topbar-title">Attendance Logs</h1>
          <div class="topbar-sub" id="topbar-sub">Attendance history mirrored from Google Sheets</div>
        </div>
        <div class="topbar-right">
          <div id="google-auth" class="google-auth"></div>
          <div class="live-pill"><span class="live-dot"></span>LIVE</div>
          <div class="clock" id="clock">--:--:--</div>
        </div>
      </header>

      <section class="view" id="view-logs">
      <div class="toolbar">
        <button class="filter-chip active" data-filter="all">All records</button>
        <button class="filter-chip" data-filter="today">Today only</button>
        <button class="filter-chip" data-filter="flagged">Flagged only</button>
        <div class="spacer"></div>
        <button class="btn ghost" id="btn-export-csv">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
          Export CSV
        </button>
      </div>
      <div class="card" style="padding:0;overflow:hidden;">
        <table>
          <thead><tr><th>Visitor</th><th>Check-in</th><th>Check-out</th><th>Duration</th><th>Status</th></tr></thead>
          <tbody id="logs-body"></tbody>
        </table>
        <div class="empty" id="logs-empty" style="display:none;">No attendance records match this filter.</div>
      </div>
    </section>

    </div>
  </div>

  <div id="modal-root"></div>
  <script src="js/script.js"></script>
</body>
</html>
